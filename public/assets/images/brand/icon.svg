<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Ultra-luxury metallic gold gradient -->
    <linearGradient id="wmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF3BA" />
      <stop offset="25%" stop-color="#E5C158" />
      <stop offset="60%" stop-color="#C59B27" />
      <stop offset="85%" stop-color="#8F6C12" />
      <stop offset="100%" stop-color="#F3DC87" />
    </linearGradient>

    <!-- Secondary highlight gold -->
    <linearGradient id="wmGoldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B27" />
      <stop offset="50%" stop-color="#FFF5C7" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>

    <!-- Deep obsidian core for flawless contrast on both light and dark backgrounds -->
    <radialGradient id="wmObsidian" cx="50%" cy="50%" r="50%">
      <stop offset="65%" stop-color="#141311" />
      <stop offset="100%" stop-color="#060605" />
    </radialGradient>

    <!-- Subtle warm glow filter -->
    <filter id="wmGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Deep Obsidian Shield / Medallion -->
  <circle cx="60" cy="60" r="55" fill="url(#wmObsidian)" stroke="url(#wmGold)" stroke-width="2.8" filter="url(#wmGlow)" />

  <!-- Inner Golden Wedding Band (Refined Ring Ring Geometry) -->
  <circle cx="60" cy="60" r="49" fill="none" stroke="url(#wmGold)" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="3 2" />

  <!-- Camera Shutter Iris Blades (6 Radial Geometry Blades) -->
  <g stroke="url(#wmGold)" stroke-width="1.2" stroke-opacity="0.38" fill="none">
    <path d="M60 11 L73 43" />
    <path d="M102.4 35.5 L78 57" />
    <path d="M102.4 84.5 L70 74" />
    <path d="M60 109 L47 77" />
    <path d="M17.6 84.5 L42 63" />
    <path d="M17.6 35.5 L50 46" />
  </g>

  <!-- Solitaire Wedding Diamond Accent at 12 o'clock Apex -->
  <!-- Represents Wedding vows & cherished eternal moments -->
  <g fill="url(#wmGoldLight)" stroke="none">
    <polygon points="60,6 64,12 60,18 56,12" />
    <circle cx="60" cy="12" r="1.5" fill="#FFFFFF" opacity="0.85" />
  </g>

  <!-- Iconic Monogram "WM" (Wedding + Moment / Camera Viewfinder) -->
  <!-- Bold, sculpted vector strokes engineered for high legibility at 16px - 128px -->
  <g stroke="url(#wmGold)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main W Monogram Path -->
    <path 
      d="M33 45 L42 76 L52 53 L60 64 L68 53 L78 76 L87 45" 
      stroke-width="3.8" 
    />

    <!-- Upper M Framing Arch / Aperture Crown -->
    <path 
      d="M40 45 L50 35 L60 43 L70 35 L80 45" 
      stroke-width="2.2" 
      stroke-opacity="0.75" 
    />
  </g>

  <!-- Center Camera Shutter Focal Node -->
  <circle cx="60" cy="59.5" r="3.2" fill="url(#wmGoldLight)" />
  <circle cx="60" cy="59.5" r="1.4" fill="#FFFFFF" opacity="0.9" />

  <!-- Fine Terminal Dots for Serif Elegance -->
  <circle cx="33" cy="45" r="2.2" fill="url(#wmGold)" />
  <circle cx="87" cy="45" r="2.2" fill="url(#wmGold)" />
</svg>
